name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Pipeline
        shell: pwsh
        run: ./build.ps1 -Version $env:GITHUB_REF_NAME.TrimStart('v')

      - name: Name the release files
        shell: pwsh
        run: |
          $v = $env:GITHUB_REF_NAME.TrimStart('v')
          New-Item -ItemType Directory release | Out-Null
          Copy-Item artifacts/publish/self-contained/SideDim.exe "release/SideDim-$v-win-x64.exe"
          Copy-Item artifacts/publish/framework-dependent/SideDim.exe "release/SideDim-$v-win-x64-needs-dotnet8.exe"
          Copy-Item LICENSE release/LICENSE.txt

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --generate-notes --title "SideDim $GITHUB_REF_NAME"
