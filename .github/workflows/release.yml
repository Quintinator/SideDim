name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check the changelog has notes for this version
        shell: pwsh
        run: |
          $v = $env:GITHUB_REF_NAME.TrimStart('v')
          ./tools/release-notes.ps1 -Version $v -Out release-notes.md

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Pipeline
        shell: pwsh
        run: |
          $v = $env:GITHUB_REF_NAME.TrimStart('v')
          ./build.ps1 -Version $v

      - name: Collect the release files
        shell: pwsh
        run: |
          $v = $env:GITHUB_REF_NAME.TrimStart('v')
          ./tools/prepare-release.ps1 -Version $v

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --verify-tag --title "SideDim $GITHUB_REF_NAME" --notes-file release-notes.md
