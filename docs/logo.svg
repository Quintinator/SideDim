<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="256" height="256" role="img" aria-label="SideDim logo: three monitors, the middle one lit, the outer two dimmed">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FFC84A" stop-opacity="0.43"/>
      <stop offset="1" stop-color="#FFC84A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD56B"/>
      <stop offset="1" stop-color="#F5A51C"/>
    </linearGradient>
  </defs>
  <ellipse cx="16" cy="15" rx="12" ry="15" fill="url(#glow)"/>
  <!-- left, dimmed -->
  <rect x="3.5" y="20" width="2" height="2.5" fill="#4B5563"/>
  <rect x="2.1" y="22.5" width="4.8" height="1.5" fill="#4B5563"/>
  <rect x="0.5" y="9" width="8" height="11" rx="1.6" fill="#374151" stroke="#6B7280" stroke-width="0.8"/>
  <!-- right, dimmed -->
  <rect x="26.5" y="20" width="2" height="2.5" fill="#4B5563"/>
  <rect x="25.1" y="22.5" width="4.8" height="1.5" fill="#4B5563"/>
  <rect x="23.5" y="9" width="8" height="11" rx="1.6" fill="#374151" stroke="#6B7280" stroke-width="0.8"/>
  <!-- middle, lit -->
  <rect x="14.57" y="22" width="2.86" height="2.5" fill="#D98E04"/>
  <rect x="12.1" y="24.5" width="7.8" height="1.5" fill="#D98E04"/>
  <rect x="9.5" y="5" width="13" height="17" rx="1.6" fill="url(#lit)"/>
</svg>
